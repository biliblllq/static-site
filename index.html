<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookmarks</title>
  <style>body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
       max-width: 540px; margin: 32px auto; padding: 0 16px; color: #222; }
h1 { font-weight: 500; }
.card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; }
.primary-url { font-size: 18px; word-break: break-all; }
.btn { display: inline-block; padding: 8px 16px; border-radius: 4px;
       background: #2080f0; color: white; text-decoration: none; cursor: pointer;
       border: none; font-size: 14px; }
.btn-warning { background: #f0a020; }
.muted { color: #888; font-size: 12px; }
.error { color: #c00; }
input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc;
                  border-radius: 4px; font: inherit; box-sizing: border-box; }
.row { margin: 8px 0; }
</style>
</head>
<body>
  <main id="app">
    <h1>Bookmarks</h1>
    <section id="import-panel" hidden>
      <div class="card">
        <h3>导入密钥</h3>
        <div class="row">
          <textarea id="bootstrap-input" rows="6" placeholder="粘贴 bootstrap 文件 / JSON"></textarea>
        </div>
        <div class="row">
          <input id="passphrase-input" type="password" placeholder="口令" />
        </div>
        <div class="row">
          <button class="btn" id="import-btn">导入</button>
        </div>
        <p class="muted" id="import-error"></p>
      </div>
    </section>
    <section id="result-panel" hidden>
      <div class="card">
        <div class="muted">当前真实入口</div>
        <div class="primary-url" id="primary-url">—</div>
        <div class="row">
          <a class="btn" id="goto-btn" href="#">一键跳转</a>
        </div>
        <div class="muted" id="meta">—</div>
      </div>
      <div class="card">
        <div class="muted">备用入口</div>
        <ul id="fallback-list"></ul>
      </div>
      <div class="row">
        <button class="btn" id="refresh-btn">刷新</button>
        <button class="btn btn-warning" id="reset-btn">切换密钥</button>
      </div>
    </section>
    <p class="error" id="error-msg"></p>
  </main>

</body>
</html>
